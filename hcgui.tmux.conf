# tmux settings of an hcGUI window (start.sh starts one tmux server per window with this file only; your own
# ~/.tmux.conf is not read). Three panes: the sidebar, the tab bar and the view. tmux passes the first click to
# whichever pane is under the pointer, so no click is spent on moving the keyboard first.

# Inside the panes: a terminal type macOS's own curses knows (python3's curses reads /usr/share/terminfo).
set -g default-terminal "screen-256color"
# Outside (Ghostty): true colour, shift+enter and other modified keys, the clipboard, the window title.
set -as terminal-features ",xterm*:RGB:extkeys:clipboard:title:focus:sync"
set -s extended-keys always
set -s extended-keys-format csi-u
set -s escape-time 10
set -s set-clipboard on
set -g focus-events on
set -g history-limit 10000

# No keys of tmux's own: every key goes to the pane with the keyboard (ctrl+b too).
set -g prefix None
set -g prefix2 None
unbind -a -T prefix

# The mouse. Only these, nothing else of tmux's defaults (no tmux menus with "Kill pane", no moving or new panes).
set -g mouse on
unbind -a -T root
bind -n MouseDown1Pane select-pane -t = \; send-keys -M
bind -n MouseDrag1Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -M }
bind -n MouseDown2Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { paste-buffer -p }
bind -n WheelUpPane if -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -e }
# A double or triple click: for a program that asks for the mouse (the sidebar, the tab bar) only the press, without
# taking the keyboard back from the view a pick gave it to; elsewhere it selects a word or a line.
bind -n DoubleClick1Pane if -F -t = "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M -t = } { select-pane -t = ; copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel }
bind -n TripleClick1Pane if -F -t = "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M -t = } { select-pane -t = ; copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel }
# A right click in the view (the shown terminal, marked by start.sh): hcGUI's menu for that terminal, shown in the tab
# bar and as a popup at the pointer (asked for through the file "ask" in the window's folder, with the pointer's
# column and line in the window: mouse_x and mouse_y count from the pane's corner); not while the view is zoomed (the
# tab bar is hidden then). Elsewhere it goes only to a program that asks for the mouse (the sidebar and the tab bar
# do: their menus). option+right click reaches such a program as option+right click.
# The right pane (a shell beside the shown terminal, @hcgui_role right): Close's question for its shell, in its header
# above it (the file "ask" of the right pane's folder; the header, @hcgui_role rhead, takes its own clicks).
bind -n MouseDown3Pane if -F -t = "#{&&:#{==:#{@hcgui_role},view},#{!:#{window_zoomed_flag}}}" { run-shell -b 'printf "menu #{e|+:#{mouse_x},#{pane_left}} #{e|+:#{mouse_y},#{pane_top}}\n" >> "$HCGUI_WINDOW/ask"' } { if -F -t = "#{==:#{@hcgui_role},right}" { run-shell -b 'printf "close\n" >> "$HCGUI_WINDOW/right/ask"' } { if -F -t = "#{mouse_any_flag}" { select-pane -t = ; send-keys -M } } }
bind -n M-MouseDown3Pane if -F -t = "#{mouse_any_flag}" { select-pane -t = ; send-keys -M }
# Shift+F10, the menu key (as a right click), on whatever has the keyboard: in the view, the shown terminal's menu in
# the tab bar, picked with the arrow keys ("menu key"; not while zoomed); in the right pane or its header, Close's
# question in the header; in the sidebar or the tab bar (they ask for the mouse), F12, which they take as their menu
# key (a typed name never takes it as a letter). Elsewhere it goes on as it is.
bind -n S-F10 if -F "#{==:#{@hcgui_role},view}" { if -F "#{window_zoomed_flag}" { send-keys S-F10 } { run-shell -b 'printf "menu key\n" >> "$HCGUI_WINDOW/ask"' } } { if -F "#{||:#{==:#{@hcgui_role},right},#{==:#{@hcgui_role},rhead}}" { run-shell -b 'printf "close\n" >> "$HCGUI_WINDOW/right/ask"' } { if -F "#{mouse_any_flag}" { send-keys F12 } { send-keys S-F10 } } }
# Dragging a divider. The sidebar keeps a dragged width: it tells a drag from a resized window by the window's width.
bind -n MouseDrag1Border resize-pane -M

# Borders: one thin line, the same with or without the keyboard.
set -g pane-border-lines single
set -g pane-border-style "fg=colour244"
set -g pane-active-border-style "fg=colour244"

# The window title: the title of the pane with the keyboard (the view sets "name · server").
set -g set-titles on
set -g set-titles-string "#{pane_title}"

# No status line, except while the view is zoomed ("z"): a line on top whose click brings the panes back.
set -g status off
set -g status-position top
set -g status-style "bg=default,fg=colour244"
set -g status-format[0] "#[align=left] ‹ back#[fg=colour244]  (click: the sidebar and the tabs come back)"
bind -n MouseDown1StatusDefault if -F "#{window_zoomed_flag}" { resize-pane -Z ; set status off }
bind -n MouseDown1StatusLeft if -F "#{window_zoomed_flag}" { resize-pane -Z ; set status off }
bind -n MouseDown1Status if -F "#{window_zoomed_flag}" { resize-pane -Z ; set status off }
set-hook -g window-layout-changed { if -F "#{window_zoomed_flag}" { set status on } { set status off } }

# Closing the Ghostty window ends this window's tmux, its panes and their programs (the terminals in herdr-core
# keep running; only the view's `hc attach` ends): start.sh sets destroy-unattached once it is attached. Not here:
# the session is made detached first, and would end at once.
